<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISIP Login</title><link rel="stylesheet" href="/static/style.css"></head><body class="login-page"><main class="login-card"><div class="brand">◈ ISIP</div><p class="muted">Security Intelligence Platform</p><h1>Sign in</h1><form id="login-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="error" class="error"></p></form><p class="muted small">Authorized investigation workspace</p></main><script>document.querySelector("#login-form").addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(f))});if(r.ok)location.reload();else document.querySelector("#error").textContent="Login failed.";});</script></body></html>
