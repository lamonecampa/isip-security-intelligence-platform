<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">ISIP | Logical system architecture</title><desc id="desc">Komponen aplikasi dan aliran data sesuai rancangan MVP saat ini.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#75a7ff"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#e8eef8}.h{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#9fb0c9}.box{fill:#111e32;stroke:#456187;stroke-width:2;rx:18}.ext{fill:#192a3e;stroke:#67a9a0;stroke-width:2;rx:18}.warn{fill:#30251b;stroke:#d39b55;stroke-width:2;rx:18}.label{font-size:22px;font-weight:650}.small{font-size:16px;fill:#b8c8dc}.tiny{font-size:14px;fill:#aebed2}.line{stroke:#75a7ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#d39b55;stroke-width:2.5;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}.tag{font-size:14px;fill:#8fb8ff;font-weight:700;letter-spacing:1px}</style></defs><rect width="1440" height="900" fill="#080f1c"/><text x="70" y="75" class="h">ISIP | Logical system architecture</text><text x="70" y="112" class="sub">Komponen aplikasi dan aliran data sesuai rancangan MVP saat ini.</text>
