<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">ISIP | Evidence processing workflow</title><desc id="desc">Alur pengumpulan bukti hingga laporan, dengan pemisahan artefak asli dan interpretasi.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#75a7ff"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#e8eef8}.h{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#9fb0c9}.box{fill:#111e32;stroke:#456187;stroke-width:2;rx:18}.ext{fill:#192a3e;stroke:#67a9a0;stroke-width:2;rx:18}.warn{fill:#30251b;stroke:#d39b55;stroke-width:2;rx:18}.label{font-size:22px;font-weight:650}.small{font-size:16px;fill:#b8c8dc}.tiny{font-size:14px;fill:#aebed2}.line{stroke:#75a7ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#d39b55;stroke-width:2.5;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}.tag{font-size:14px;fill:#8fb8ff;font-weight:700;letter-spacing:1px}</style></defs><rect width="1440" height="900" fill="#080f1c"/><text x="70" y="75" class="h">ISIP | Evidence processing workflow</text><text x="70" y="112" class="sub">Alur pengumpulan bukti hingga laporan, dengan pemisahan artefak asli dan interpretasi.</text>
<rect x="70" y="300" width="220" height="150" class="ext"/><text x="100" y="345" class="label">Input evidence</text><text x="100" y="385" class="small">URL / screenshot</text><text x="100" y="415" class="small">file yang sah</text>
<rect x="370" y="300" width="220" height="150" class="box"/><text x="400" y="345" class="label">Validation</text><text x="400" y="385" class="small">type / size / scope</text><text x="400" y="415" class="small">safe filename</text>
<rect x="670" y="300" width="220" height="150" class="ext"/><text x="700" y="345" class="label">Preservation</text><text x="700" y="385" class="small">original file</text><text x="700" y="415" class="small">SHA-256 + time</text>
<rect x="970" y="160" width="220" height="150" class="box"/><text x="1000" y="205" class="label">Analysis</text><text x="1000" y="245" class="small">public indicators</text><text x="1000" y="275" class="small">unverified findings</text>
<rect x="970" y="480" width="220" height="150" class="warn"/><text x="1000" y="525" class="label">Human review</text><text x="1000" y="565" class="small">verify context</text><text x="1000" y="595" class="small">record decision</text>
<rect x="1260" y="300" width="130" height="150" class="ext"/><text x="1280" y="345" class="label">Report</text><text x="1280" y="385" class="small">case summary</text><text x="1280" y="415" class="small">evidence trail</text>
<path d="M290 375 H370" class="line"/><path d="M590 375 H670" class="line"/><path d="M890 350 L970 235" class="line"/><path d="M1080 310 V480" class="line"/><path d="M1190 555 L1325 450" class="line"/>
<text x="70" y="700" class="small">Integrity rule: never overwrite the original evidence with annotations or AI-generated interpretations.</text>
<text x="70" y="740" class="small">Decision rule: automated matches are leads, not proof of identity, intent, or wrongdoing.</text>
<text x="70" y="860" class="tiny">ISIP MVP · conceptual test topology · public sources and authorized evidence only</text></svg>