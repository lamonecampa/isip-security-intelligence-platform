<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">ISIP | Isolated experimental network</title><desc id="desc">Rancangan uji fungsional dengan data sintetis dan akun dummy, tanpa menguji akun pihak ketiga.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#75a7ff"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#e8eef8}.h{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#9fb0c9}.box{fill:#111e32;stroke:#456187;stroke-width:2;rx:18}.ext{fill:#192a3e;stroke:#67a9a0;stroke-width:2;rx:18}.warn{fill:#30251b;stroke:#d39b55;stroke-width:2;rx:18}.label{font-size:22px;font-weight:650}.small{font-size:16px;fill:#b8c8dc}.tiny{font-size:14px;fill:#aebed2}.line{stroke:#75a7ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#d39b55;stroke-width:2.5;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}.tag{font-size:14px;fill:#8fb8ff;font-weight:700;letter-spacing:1px}</style></defs><rect width="1440" height="900" fill="#080f1c"/><text x="70" y="75" class="h">ISIP | Isolated experimental network</text><text x="70" y="112" class="sub">Rancangan uji fungsional dengan data sintetis dan akun dummy, tanpa menguji akun pihak ketiga.</text>
<rect x="90" y="210" width="260" height="150" class="ext"/><text x="125" y="255" class="tag">TEST OPERATOR</text><text x="125" y="300" class="label">Client PC</text><text x="125" y="335" class="small">Browser + test cases</text>
<rect x="450" y="180" width="300" height="210" class="box"/><text x="485" y="225" class="tag">ISOLATED LAN</text><text x="485" y="275" class="label">Lab switch / router</text><text x="485" y="315" class="small">Private subnet</text><text x="485" y="350" class="small">Firewall egress rules</text>
<rect x="850" y="140" width="260" height="150" class="box"/><text x="885" y="185" class="tag">APPLICATION HOST</text><text x="885" y="230" class="label">ISIP Docker</text><text x="885" y="265" class="small">Web + DB + worker</text>
<rect x="850" y="400" width="260" height="150" class="ext"/><text x="885" y="445" class="tag">TEST DATA</text><text x="885" y="490" class="label">Synthetic fixtures</text><text x="885" y="525" class="small">Dummy profiles / URLs</text>
<rect x="1190" y="280" width="180" height="170" class="warn"/><text x="1215" y="325" class="label">Internet</text><text x="1215" y="365" class="small">Allowlisted</text><text x="1215" y="395" class="small">public endpoints</text>
<path d="M350 285 H450" class="line"/><path d="M750 285 H850" class="line"/><path d="M980 290 V400" class="line"/><path d="M1110 215 L1190 320" class="dash"/>
<text x="1118" y="185" class="tiny">optional egress</text>
<text x="100" y="650" class="small">Uji awal: login, pembuatan case, upload bukti, verifikasi SHA-256, job queue, hasil username dummy, audit log, ekspor laporan.</text>
<text x="100" y="690" class="small">Jangan gunakan kredensial, cookie, IP login, atau data privat milik orang lain sebagai bahan uji.</text>
<text x="70" y="860" class="tiny">ISIP MVP · conceptual test topology · public sources and authorized evidence only</text></svg>