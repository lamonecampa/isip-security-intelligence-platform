<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">ISIP | Docker deployment topology</title><desc id="desc">Topologi container lokal pada Docker Compose, bukan arsitektur produksi publik.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#75a7ff"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#e8eef8}.h{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#9fb0c9}.box{fill:#111e32;stroke:#456187;stroke-width:2;rx:18}.ext{fill:#192a3e;stroke:#67a9a0;stroke-width:2;rx:18}.warn{fill:#30251b;stroke:#d39b55;stroke-width:2;rx:18}.label{font-size:22px;font-weight:650}.small{font-size:16px;fill:#b8c8dc}.tiny{font-size:14px;fill:#aebed2}.line{stroke:#75a7ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#d39b55;stroke-width:2.5;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow)}.tag{font-size:14px;fill:#8fb8ff;font-weight:700;letter-spacing:1px}</style></defs><rect width="1440" height="900" fill="#080f1c"/><text x="70" y="75" class="h">ISIP | Docker deployment topology</text><text x="70" y="112" class="sub">Topologi container lokal pada Docker Compose, bukan arsitektur produksi publik.</text>
<rect x="100" y="180" width="1240" height="570" class="box"/><text x="140" y="225" class="tag">DOCKER HOST / SINGLE MACHINE</text>
<rect x="170" y="300" width="250" height="150" class="ext"/><text x="205" y="345" class="label">Browser</text><text x="205" y="385" class="small">localhost:8000</text>
<rect x="520" y="270" width="300" height="200" class="box"/><text x="555" y="315" class="tag">CONTAINER: WEB</text><text x="555" y="365" class="label">FastAPI + UI</text><text x="555" y="405" class="small">127.0.0.1:8000</text><text x="555" y="435" class="small">Session + REST API</text>
<rect x="950" y="270" width="300" height="150" class="ext"/><text x="985" y="315" class="tag">PERSISTENT VOLUME</text><text x="985" y="360" class="label">isip_data</text><text x="985" y="395" class="small">SQLite + evidence</text>
<rect x="520" y="560" width="300" height="130" class="box"/><text x="555" y="605" class="tag">CONTAINER: REDIS</text><text x="555" y="650" class="label">Job broker</text>
<rect x="950" y="530" width="300" height="160" class="box"/><text x="985" y="575" class="tag">CONTAINER: WORKER</text><text x="985" y="620" class="label">Celery + Sherlock</text><text x="985" y="655" class="small">No public inbound port</text>
<path d="M420 375 H520" class="line"/><path d="M820 350 H950" class="line"/><path d="M670 470 V560" class="line"/><path d="M820 625 H950" class="line"/>
<text x="140" y="715" class="small">Published port is bound to loopback only. Add TLS, reverse proxy, backups and access controls before remote deployment.</text>
<text x="70" y="860" class="tiny">ISIP MVP · conceptual test topology · public sources and authorized evidence only</text></svg>