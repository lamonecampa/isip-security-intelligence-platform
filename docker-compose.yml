services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/isip.db
      EVIDENCE_DIR: /app/data/evidence
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - isip_data:/app/data
    depends_on: [redis]
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/isip.db
      EVIDENCE_DIR: /app/data/evidence
      REDIS_URL: redis://redis:6379/0
    volumes:
      - isip_data:/app/data
    depends_on: [redis]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: [redis_data:/data]
    restart: unless-stopped
volumes:
  isip_data:
  redis_data:
